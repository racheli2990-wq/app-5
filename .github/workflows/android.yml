name: Build HELEN AI 6 - Bundled Qwen2.5 1.5B APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download bundled Qwen2.5 1.5B INT8 LiteRT-LM model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://huggingface.co/litert-community/Qwen2.5-1.5B-Instruct/resolve/main/Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv4096.litertlm" \
            -o "app/src/main/assets/Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv4096.litertlm"
          MODEL_BYTES="$(stat -c%s app/src/main/assets/Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv4096.litertlm)"
          echo "Bundled Qwen2.5 model size: ${MODEL_BYTES} bytes"
          test "${MODEL_BYTES}" -ge 1500000000
          test "${MODEL_BYTES}" -le 1800000000
      - name: Compile APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK contains complete model asset
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv4096.litertlm"
          APK_BYTES="$(stat -c%s "$APK")"
          echo "APK size: ${APK_BYTES} bytes"
          test "$APK_BYTES" -ge 1500000000
          test "$APK_BYTES" -le 1900000000
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: helen-ai-qwen25-1.5b-bundled-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helen-qwen25-1.5b-bundled-build-${{ github.run_number }}
          name: HELEN AI 6.0 · Qwen2.5 1.5B bundled · build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
