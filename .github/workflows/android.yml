name: Build HELEN AI 5 - Bundled Qwen3 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download bundled Qwen3 0.6B INT4 model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://huggingface.co/litert-community/Qwen3-0.6B-int4/resolve/main/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm" \
            -o "app/src/main/assets/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm"
          MODEL_BYTES="$(stat -c%s app/src/main/assets/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm)"
          echo "Bundled model size: ${MODEL_BYTES} bytes"
          test "${MODEL_BYTES}" -ge 300000000
          test "${MODEL_BYTES}" -le 400000000
      - name: Compile APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK contains bundled model
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm"
          APK_BYTES="$(stat -c%s "$APK")"
          echo "APK size: ${APK_BYTES} bytes"
          test "$APK_BYTES" -ge 300000000
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: helen-ai-qwen3-bundled-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helen-qwen3-bundled-build-${{ github.run_number }}
          name: HELEN AI 5.0 · Qwen3 bundled · build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
