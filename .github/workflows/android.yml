name: Build Helen AI 4 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify model download endpoint
        run: |
          curl -L --fail --silent --show-error --range 0-1023 \
            "https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/main/gemma-4-E2B-it.litertlm?download=true" \
            -o /tmp/gemma-model-check
          test "$(stat -c%s /tmp/gemma-model-check)" -ge 1024
          echo "Gemma 4 download endpoint is reachable."
      - name: Compile APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: helen-ai-gemma4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helen-gemma4-build-${{ github.run_number }}
          name: Helen AI 4.0 Gemma 4 build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
