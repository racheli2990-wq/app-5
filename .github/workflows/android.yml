name: Build Helen AI APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download embedded offline AI model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 5 --retry-delay 3 \
            "https://huggingface.co/litert-community/Qwen3-0.6B-int4/resolve/main/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm?download=true" \
            -o app/src/main/assets/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm
          test "$(stat -c%s app/src/main/assets/qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm)" -gt 300000000
          ls -lh app/src/main/assets/
      - name: Compile APK with bundled model
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: helen-ai-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helen-ai-build-${{ github.run_number }}
          name: Helen AI offline build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
