name: Build HELEN AI 7 - Bundled Qwen3 1.7B INT4 APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download bundled Qwen3 1.7B INT4 LiteRT-LM model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            "https://huggingface.co/litert-community/Qwen3-1.7B/resolve/main/Qwen3-1.7B_dynamic_wi4b32_afp32.litertlm" \
            -o "app/src/main/assets/Qwen3-1.7B_dynamic_wi4b32_afp32.litertlm"
          MODEL_BYTES="$(stat -c%s app/src/main/assets/Qwen3-1.7B_dynamic_wi4b32_afp32.litertlm)"
          echo "Bundled Qwen3 INT4 model size: ${MODEL_BYTES} bytes"
          test "${MODEL_BYTES}" -ge 850000000
          test "${MODEL_BYTES}" -le 1100000000
      - name: Compile APK
        run: gradle --no-daemon assembleDebug
      - name: Verify complete model is inside APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "assets/Qwen3-1.7B_dynamic_wi4b32_afp32.litertlm"
          APK_BYTES="$(stat -c%s "$APK")"
          echo "APK size: ${APK_BYTES} bytes"
          test "$APK_BYTES" -ge 900000000
          test "$APK_BYTES" -le 1300000000
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: helen-ai-qwen3-1.7b-int4-bundled-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: helen-qwen3-1.7b-int4-build-${{ github.run_number }}
          name: HELEN AI 7.0 · Qwen3 1.7B INT4 · build ${{ github.run_number }}
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
